<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/professor-nutri-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduFood Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
             fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Fredoka', 'sans-serif'], // New font for headings/fun elements
            },
            spacing: {
              '0.5': '2px', '1': '4px', '1.5': '6px', '2': '8px', '2.5': '10px', '3': '12px', '3.5': '14px', '4': '16px', '5': '20px', '6': '24px', '7': '28px', '8': '32px', '10': '40px', '12': '48px', '14': '56px', '16': '64px', '20': '80px', '24': '96px',
            },
            colors: {
              brand: {
                background: '#FAFAFA', // Slightly warmer/lighter gray
                surface: '#FFFFFF',
                text: '#1F2937', // Gray 800 - softer than pure black
                'text-secondary': '#6B7280', // Gray 500
                border: '#F3F4F6', // Gray 100 - Very subtle
                'primary-light': '#D1FAE5', 
                primary: '#10B981', 
                'primary-dark': '#059669',
                'risk-low': '#16A34A',
                'risk-medium': '#F59E0B',
                'risk-high': '#EF4444',
                'accent-purple': '#8B5CF6', // For magical/AI moments
                'accent-orange': '#F97316', // For gamification
              },
            },
            borderRadius: {
              'sm': '6px', 'md': '10px', 'lg': '16px', 'xl': '20px', '2xl': '28px', '3xl': '36px', 'full': '9999px',
            },
            boxShadow: {
              'edu': '0 4px 20px -2px rgba(0, 0, 0, 0.05)', // Softer, more diffused
              'edu-lg': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
              'float': '0 8px 30px rgba(0,0,0,0.08)', // For floating elements
              'glow': '0 0 15px rgba(16, 185, 129, 0.3)', // For active states
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'pop': {
                '0%': { transform: 'scale(0.95)' },
                '50%': { transform: 'scale(1.02)' },
                '100%': { transform: 'scale(1)' },
              },
              'slide-in-up': {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
               'confetti-rain': {
                '0%': { transform: 'translateY(-100%)', opacity: '1' },
                '100%': { transform: 'translateY(200vh)', opacity: '0' },
              },
               'pulse-fire': {
                '0%, 100%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 3px rgba(255,159,64,0.4))' },
                '50%': { transform: 'scale(1.1)', filter: 'drop-shadow(0 0 10px rgba(255,159,64,0.8))' }
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            },
            animation: {
              'fade-in': 'fade-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'slide-in-up': 'slide-in-up 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'pulse-fire': 'pulse-fire 2s ease-in-out infinite',
              'float': 'float 3s ease-in-out infinite',
            }
          },
        },
      };
    </script>
    <style>
      /* Garante texto de alto contraste nos inputs */
      input, textarea, select {
        color: #1F2937; 
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Fredoka', sans-serif; /* Friendly font for headings */
      }
      input::placeholder, textarea::placeholder {
        color: #9CA3AF; 
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      /* Custom Scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #E5E7EB;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D1D5DB;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
</head>
  <body class="bg-brand-background text-brand-text antialiased selection:bg-brand-primary-light selection:text-brand-primary-dark">
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
