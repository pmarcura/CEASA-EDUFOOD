<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/professor-nutri-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduFood Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
             fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            spacing: {
              '0.5': '2px', '1': '4px', '1.5': '6px', '2': '8px', '2.5': '10px', '3': '12px', '3.5': '14px', '4': '16px', '5': '20px', '6': '24px', '7': '28px', '8': '32px', '10': '40px', '12': '48px', '14': '56px', '16': '64px', '20': '80px',
            },
            colors: {
              brand: {
                background: '#F9FAFB', // Gray 50 - Softer background
                surface: '#FFFFFF',
                text: '#111827', // Gray 900
                'text-secondary': '#6B7280', // Gray 500
                border: '#E5E7EB', // Gray 200
                'primary-light': '#D1FAE5', // Emerald 100
                primary: '#10B981', // Emerald 500 (WCAG AA compliant on white)
                'primary-dark': '#059669', // Emerald 600
                'risk-low': '#16A34A', // Green 600
                'risk-medium': '#F59E0B', // Amber 500
                'risk-high': '#EF4444', // Red 500,
                // iOS Inspired Palette
                'ios-background': '#F2F2F7',
                'ios-blue': '#007AFF',
                'ios-gray': '#E5E5EA',
                'ios-gray-dark': '#D1D1D6',
              },
            },
            borderRadius: {
              'sm': '4px', 'md': '8px', 'lg': '12px', 'xl': '16px', '2xl': '24px', '3xl': '32px', 'full': '9999px',
            },
            boxShadow: {
              'edu': '0 2px 8px 0 rgba(0, 0, 0, 0.04)',
              'edu-lg': '0 8px 20px -4px rgba(0, 0, 0, 0.06), 0 6px 8px -5px rgba(0, 0, 0, 0.05)',
            },
            fontSize: {
              'xs': ['12px', '16px'], 'sm': ['14px', '20px'], 'base': ['16px', '24px'], 'lg': ['18px', '24px'], 'xl': ['20px', '28px'], '2xl': ['24px', '32px'], '3xl': ['28px', '36px'], '4xl': ['32px', '40px'],
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in-up': {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'slide-out-down': {
                '0%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(100%)', opacity: '0' },
              },
               'confetti-rain': {
                '0%': { transform: 'translateY(-100%)', opacity: '1' },
                '100%': { transform: 'translateY(200vh)', opacity: '0' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'slide-in-up': 'slide-in-up 0.3s ease-out forwards',
              'slide-out-down': 'slide-out-down 0.3s ease-in forwards',
            }
          },
        },
      };
    </script>
    <style>
      /* Garante texto de alto contraste nos inputs */
      input, textarea {
        color: #111827; /* brand.text */
      }
      input::placeholder, textarea::placeholder {
        color: #6B7280; /* brand.text-secondary */
      }
      /* More native-like mobile experience */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
</head>
  <body class="bg-brand-background">
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
