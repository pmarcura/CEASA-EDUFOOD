<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/professor-nutri-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduFood Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
             fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            spacing: {
              '0.5': '2px', '1': '4px', '1.5': '6px', '2': '8px', '2.5': '10px', '3': '12px', '3.5': '14px', '4': '16px', '5': '20px', '6': '24px', '7': '28px', '8': '32px', '10': '40px', '12': '48px', '14': '56px', '16': '64px', '20': '80px',
            },
            colors: {
              brand: {
                background: '#F9FAFB', // Gray 50 - Softer background
                surface: '#FFFFFF',
                text: '#111827', // Gray 900
                'text-secondary': '#6B7280', // Gray 500
                border: '#E5E7EB', // Gray 200
                'primary-light': '#D1FAE5', // Emerald 100
                primary: '#10B981', // Emerald 500 (WCAG AA compliant on white)
                'primary-dark': '#059669', // Emerald 600
                'risk-low': '#16A34A', // Green 600
                'risk-medium': '#F59E0B', // Amber 500
                'risk-high': '#EF4444', // Red 500
              },
            },
            borderRadius: {
              'sm': '4px', 'md': '8px', 'lg': '12px', 'xl': '16px', '2xl': '24px', '3xl': '32px', 'full': '9999px',
            },
            boxShadow: {
              'edu': '0 2px 8px 0 rgba(0, 0, 0, 0.04)',
              'edu-lg': '0 8px 20px -4px rgba(0, 0, 0, 0.06), 0 6px 8px -5px rgba(0, 0, 0, 0.05)',
            },
            fontSize: {
              'xs': ['12px', '16px'], 'sm': ['14px', '20px'], 'base': ['16px', '24px'], 'lg': ['18px', '24px'], 'xl': ['20px', '28px'], '2xl': ['24px', '32px'], '3xl': ['28px', '36px'], '4xl': ['32px', '40px'],
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
            }
          },
        },
      };
    </script>
    <style>
      /* Garante texto de alto contraste nos inputs */
      input, textarea {
        color: #111827; /* brand.text */
      }
      input::placeholder, textarea::placeholder {
        color: #6B7280; /* brand.text-secondary */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/"
  }
}
</script>
</head>
  <body class="bg-brand-background">
    <div id="global-error-overlay" style="display: none; position: fixed; inset: 0; background-color: rgba(40, 10, 10, 0.95); color: #fee2e2; z-index: 9999; padding: 2rem; font-family: 'Inter', sans-serif; overflow-y: auto;">
      <div style="max-width: 800px; margin: auto;">
        <h1 style="font-size: 1.5rem; font-weight: bold; color: #fecaca; border-bottom: 1px solid #ef4444; padding-bottom: 0.5rem; margin-bottom: 1rem;">Erro Crítico na Aplicação</h1>
        <p style="color: #fda4af; margin-bottom: 1rem;">O aplicativo não pôde ser carregado devido a um erro fatal. Isso geralmente é causado por um problema de configuração ou um erro de script que impede o React de iniciar.</p>
        <div style="background: #111827; padding: 1rem; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-all; font-size: 0.8rem;" id="global-error-details"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const showErrorOverlay = (message, source, lineno, colno, error) => {
        const overlay = document.getElementById('global-error-overlay');
        const details = document.getElementById('global-error-details');
        if (overlay && details) {
          let errorText = `Message: ${message}\n`;
          if (source) errorText += `Source: ${source}\nLine: ${lineno}, Column: ${colno}\n`;
          if (error && error.stack) errorText += `\nStack Trace:\n${error.stack}`;
          
          details.textContent = errorText;
          overlay.style.display = 'block';
          
          const rootEl = document.getElementById('root');
          if (rootEl) rootEl.style.display = 'none';
        }
      };
  
      window.addEventListener('error', (event) => {
        if (event.message.includes('Script error.')) return;
        showErrorOverlay(event.message, event.filename, event.lineno, event.colno, event.error);
      });
  
      window.addEventListener('unhandledrejection', (event) => {
        const error = event.reason instanceof Error ? event.reason : new Error(JSON.stringify(event.reason));
        showErrorOverlay(error.message || 'Unhandled promise rejection', '', '', '', error);
      });
    </script>
  </body>
</html>
